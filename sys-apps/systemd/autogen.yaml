systemd:
  generator: github-1
  packages:
    - systemd:
        github:
          user: systemd
          repo: systemd-stable
          query: releases
          template: systemd.tmpl
          select: '^v254.*'

    - systemd:
        github:
          user: systemd
          repo: systemd-stable
          query: releases
          select: '^v252.*'
          template: systemd.tmpl

    - systemd:
        github:
          user: systemd
          repo: systemd-stable
          query: releases
          select: '^v253.*'
          template: systemd.tmpl

