systemd:
  generator: builtin-github
  template:
    engine: j2cli

  defaults:
    category: sys-apps
    github:
      user: systemd
      repo: systemd-stable
      query: releases
      num_pages: 5

  packages:
    - systemd:
        selector:
          - '<254.22'
          - '>=254.0'

    - systemd:
        selector:
          - '<253.0'
          - '>=252.0'

    - systemd:
        selector:
          - '<254.0'
          - '>=253.0'

