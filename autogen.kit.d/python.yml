global_settings:
  generator: builtin-pypi
  template:
    engine: j2cli
  defaults:
    category: dev-python
    template: "templates/pypi-generic.tmpl"

hatchling_modules:
  defaults:
    vars:
      du_pep517: hatchling

  packages:
    - expandvars:
        pydeps_ignore:
          - extra == 'tests'
        python_compat: "python3+"
        vars:
          license: MIT

standalone_modules:
  defaults:
    vars:
      du_pep517: standalone

  packages:
    - propcache:
        pydeps:
          py:all:build:
            - expandvars
            - setuptools
          use:native-extensions:build:
            - cython
        python_compat: "python3+"

        vars:
          license: Apache-2.0
          iuse: +native-extensions

          body: |
            python_compile() {
              local -x PROPCACHE_NO_EXTENSIONS=0
              if ! use native-extensions || [[ ${EPYTHON} != python* ]]; then
                PROPCACHE_NO_EXTENSIONS=1
              fi
              distutils-r1_python_compile
            }


python_oracledb:
  defaults:
    pydeps:
      py:all:runtime:
        - typing-extensions
        - cryptography
      py:all:build:
        - cython
        - wheel
    pypi_name: oracledb
    vars:
      du_pep517: setuptools
      license: Apache-2.0 UPL-1.0
      body: |
        python_install_all() {
          distutils-r1_python_install_all

          if use doc; then
            dohtml -r html/* || die
          fi

          if use examples; then
            docinto examples
            dodoc samples/* || die
          fi
        }
      depend: '${RDEPEND}'
      rdepend: |
        dev-db/oracle-instantclient-basic

  packages:

    - python-oracledb:
        selector:
          - '<4.0'

    - python-oracledb:
        selector:
          - '=2.4.1'

python_oci:
  defaults:
    pypi_name: oci
    pydeps:
      py:all:runtime:
        - certifi
        - cryptography
        - pyopenssl
        - pytz
        - python-dateutil
        - urllib3
        - circuitbreaker
        - pyjwt
        - crc32c
        - aiohttp
      py:all:build:
        - certifi
        - cryptography
        - pyopenssl
        - pytz
        - python-dateutil
        - urllib3
        - circuitbreaker
        - pyjwt
        - crc32c
        - aiohttp
    vars:
      du_pep517: setuptools
      license: Apache-2.0 UPL-1.0

  packages:

    - oci:

python_ocicli:
  defaults:
    pypi_name: oci-cli
    pydeps:
      py:all:both:
        - oci
        - arrow
        - certifi
        - click
        - cryptography
        - pyopenssl
        - jmespath
        - pytz
        - python-dateutil
        - terminaltables
        - pyyaml
        - prompt_toolkit
    vars:
      du_pep517: setuptools
      license: Apache-2.0 UPL-1.0

  packages:

    - oci-cli:
